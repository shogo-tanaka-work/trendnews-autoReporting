# neta_weekly だけの追加設定。gen:systemd は systemd/generated/ しか触らないので、
# ここは手で管理する（生成対象ではない）。
#
# 収集後に昇格台帳を commit して push する。ProtectSystem=strict の下では
# テンプレート側の ReadWritePaths=<repo>/data しか書けないため、
# archive/ と .git/ を明示的に開ける。
[Service]
ReadWritePaths=/home/shogo/apps/trendnews-autoReporting/archive
ReadWritePaths=/home/shogo/apps/trendnews-autoReporting/.git
ExecStartPost=/home/shogo/apps/trendnews-autoReporting/scripts/commit-archive.sh
